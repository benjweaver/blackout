# XcodeGen spec. The .xcodeproj is generated and gitignored: `xcodegen generate`.
name: Blackout
options:
  bundleIdPrefix: dev.benjweaver
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Blackout:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Blackout
        CFBundleDisplayName: Blackout
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "GPL-3.0-or-later"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.benjweaver.Blackout
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        # Local "Ben Weaver" identity by hash (see build.sh); ad-hoc if absent.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
